<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Crop Field App</title>
</head>
<body>
    <h1>Testing Script Load</h1>
    <div id="status">Loading...</div>

    <script>
        // Test if GeometryUtils loads
        document.write('<p>Loading geometry.js...</p>');
    </script>
    <script src="geometry.js"></script>
    <script>
        if (typeof GeometryUtils !== 'undefined') {
            document.write('<p style="color: green;">✓ geometry.js loaded successfully</p>');
        } else {
            document.write('<p style="color: red;">✗ geometry.js failed to load</p>');
        }

        document.write('<p>Loading app.js...</p>');
    </script>
    <script src="app.js"></script>
    <script>
        if (typeof CropFieldApp !== 'undefined') {
            document.write('<p style="color: green;">✓ app.js loaded successfully</p>');
        } else {
            document.write('<p style="color: red;">✗ app.js failed to load</p>');
        }

        // Try to find the canvas
        setTimeout(() => {
            const canvas = document.getElementById('fieldCanvas');
            if (!canvas) {
                document.getElementById('status').innerHTML = '<p style="color: orange;">⚠ Canvas element not found (expected - this is just a test page)</p>';
            }
        }, 100);
    </script>
</body>
</html>
